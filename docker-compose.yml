name: english-coach

services:
  frontend-build:
    image: node:22-slim
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
      - frontend-dist:/dist
    # Sin `tsc -b` para no reescribir tsconfig.app.tsbuildinfo del repo.
    command: sh -c "npm ci --legacy-peer-deps && npx vite build --outDir /dist --emptyOutDir"
    restart: "no"

  backend:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    working_dir: /app
    volumes:
      - ./backend:/app
      - backend-venv:/venv
      # Conservar la base SQLite actual (historial + aprendizaje)
      - ./backend/data:/data
    env_file:
      - ./backend/.env
    environment:
      UV_PROJECT_ENVIRONMENT: /venv
      UV_LINK_MODE: copy
      # Las variables de entorno tienen prioridad sobre backend/.env.
      LLM_BASE_URL: ${LLM_BASE_URL:-http://192.168.0.50:1234/v1}
      SESSION_DB_PATH: /data/sessions.db
      PYTHONUNBUFFERED: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # 1 worker: los locks de historial/aprendizaje viven en memoria del proceso.
    command: >
      sh -c "uv sync --frozen --no-dev &&
             uv run --no-sync uvicorn main:app --host 0.0.0.0 --port 8000 --workers 1"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    depends_on:
      frontend-build:
        condition: service_completed_successfully
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - frontend-dist:/usr/share/nginx/html:ro
    configs:
      - source: nginx-conf
        target: /etc/nginx/conf.d/default.conf
    restart: unless-stopped

configs:
  nginx-conf:
    content: |
      map $$http_upgrade $$connection_upgrade {
        default upgrade;
        ''      close;
      }

      server {
        listen 80;
        root /usr/share/nginx/html;
        index index.html;

        # Chat (SSE) y voz (WebSocket).
        location /api/ {
          proxy_pass http://backend:8000;
          proxy_http_version 1.1;
          proxy_set_header Host $$host;
          proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $$scheme;
          proxy_set_header Upgrade $$http_upgrade;
          proxy_set_header Connection $$connection_upgrade;
          proxy_buffering off;
          proxy_cache off;
          proxy_read_timeout 1h;
          proxy_send_timeout 1h;
        }

        location = /health {
          proxy_pass http://backend:8000;
        }

        # SPA: rutas como /chat o /history caen en index.html.
        location / {
          try_files $$uri $$uri/ /index.html;
        }
      }

volumes:
  frontend-node-modules:
  frontend-dist:
  backend-venv:
